[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/api/landing/podiums"
  to = "/.netlify/functions/landing-podiums"
  status = 200
  force = true

# If deploy artifacts grow too large/time out, consider:
# command = "npm run build && rm -rf .next/cache"
